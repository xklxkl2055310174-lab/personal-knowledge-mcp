name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --locked
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -m "not docker"
      - run: uv run pytest -m docker
      - run: uv run python scripts/generate_tools_doc.py --check
      - run: uv run knowledge-mcp-eval --mode delegated --strategy relevant
      - name: Streamable HTTP smoke test
        shell: bash
        run: |
          uv run knowledge-mcp > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              break
            fi
            sleep 0.5
          done
          uv run python scripts/smoke_http.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
